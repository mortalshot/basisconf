<div id="video" aria-hidden="true" class="popup popup_video">
	<div class="popup__wrapper">
		<div class="popup__content">
			<button data-close type="button" class="popup__close"> <img src="@img/icons/close.svg" alt="" loading="lazy"> </button>
			<div data-youtube-place class="popup__text"></div>
		</div>
	</div>
</div>

<div id="registration" aria-hidden="true" class="popup popup_reg">
	<div class="popup__wrapper">
		<div class="popup__content">
			<button data-close type="button" class="popup__close"> <img src="@img/icons/close.svg" alt="" loading="lazy"> </button>
			<div class="popup__text">
				<form action="" class="form">
					<div class="form__row">
						<div class="col-12 form__item">
							<input type="text" name="reg-name" placeholder="ФИО" class="input">
						</div>
						<div class="col-12 form__item">
							<input type="text" name="reg-company" placeholder="Компания" class="input">
						</div>
						<div class="col-12 form__item">
							<input type="email" name="reg-mail" placeholder="E-mail" class="input">
						</div>
						<div class="col-12 form__item">
							<input type="text" name="reg-mail" placeholder="+7" class="input input_phone">
						</div>
						<div class="col-12 form__item">
							<div class="checkbox">
								<input id="privacy" class="checkbox__input" type="checkbox" value="1" name="form[]">
								<label for="privacy" class="checkbox__label"><span class="checkbox__text">Я согласен на <a href="">обработку персональных данных</a></span></label>
							</div>
						</div>
						<div class="col-12 form__item">
							<button type="submit" class="btn btn_bg-blue">Зарегистрироваться</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
